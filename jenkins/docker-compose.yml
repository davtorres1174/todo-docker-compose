services:
  jenkins:
    build: .
    image: todo-jenkins:1.0.0
    container_name: jenkins-todo
    environment:
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD}
      POSTGRES_CI_PASSWORD: ${POSTGRES_CI_PASSWORD}
    ports:
      - "${JENKINS_PORT:-8080}:8080"   # interfaz web de Jenkins
    volumes:
      # Datos de Jenkins (jobs, historial de builds, credenciales cifradas)
      - jenkins_home:/var/jenkins_home
      # Acceso al motor de Docker del anfitrion para construir las imagenes.
      # Aceptable en un laboratorio local; en produccion se usan agentes dedicados.
      - /var/run/docker.sock:/var/run/docker.sock
    # El socket pertenece al grupo root (gid 0) en Docker Desktop; en Linux usar
    # el gid del socket: DOCKER_GID=$(stat -c %g /var/run/docker.sock)
    group_add:
      - "${DOCKER_GID:-0}"
    restart: unless-stopped

volumes:
  jenkins_home:
    name: jenkins_home_todo
