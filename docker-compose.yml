services:
  # ---------- Contenedor 1: aplicacion (Flask) ----------
  app:
    build: ./app
    image: todo-app:1.0.0
    container_name: todo-app
    environment:
      DB_HOST: db            # <- NOMBRE DEL SERVICIO, no localhost ni IP
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${APP_PORT:-5000}:5000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - red_todo
    restart: unless-stopped

  # ---------- Contenedor 2: base de datos (PostgreSQL) ----------
  db:
    build: ./db
    image: todo-db:1.0.0
    container_name: todo-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - red_todo
    restart: unless-stopped
    # Sin "ports": la base de datos solo es accesible dentro de la red de Docker

networks:
  red_todo:
    name: red_todo
    driver: bridge

volumes:
  datos_postgres:
    name: datos_postgres
